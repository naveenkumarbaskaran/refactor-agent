[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "refactor-agent"
version = "0.1.0"
description = "AI-powered Python code smell detector and refactoring agent using Claude"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Refactor Agent Contributors" },
]
keywords = ["refactoring", "code-quality", "llm", "claude", "ast"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "anthropic>=0.40.0",
    "click>=8.1",
    "rich>=13.0",
]

[project.scripts]
refactor-agent = "refactor_agent.cli:main"

[project.urls]
Homepage = "https://github.com/example/refactor-agent"
Repository = "https://github.com/example/refactor-agent"
Issues = "https://github.com/example/refactor-agent/issues"

[tool.hatch.version]
path = "refactor_agent/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["refactor_agent"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
